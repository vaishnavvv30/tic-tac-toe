<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Poppins:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body onload="brython()">

<div class="stage">
  <div class="titleblock">
    <h1>TIC TAC TOE</h1>
    <div class="subhead">Tic Tac Toe</div>
  </div>

  <div class="mode-select" id="modeSelect">
    <button data-mode="pve" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="4" y="7" width="16" height="12" rx="3"/><path d="M8 7V5a4 4 0 0 1 8 0v2"/><circle cx="9" cy="13" r="1"/><circle cx="15" cy="13" r="1"/></svg>
      VS AI
    </button>
    <button data-mode="pvp">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="8" cy="8" r="3.2"/><circle cx="16" cy="8" r="3.2"/><path d="M2 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5M10 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/></svg>
      VS FRIEND
    </button>
  </div>

  <div class="vs-row">
    <div class="fighter player active" id="fighterPlayer">
      <div class="avatar">
        <svg viewBox="0 0 40 40"><circle cx="20" cy="17" r="10" fill="#fff8ec" stroke="#161311" stroke-width="2"/><circle cx="16.5" cy="16" r="1.6" fill="#161311"/><circle cx="23.5" cy="16" r="1.6" fill="#161311"/><path d="M15 20.5 Q20 24 25 20.5" stroke="#161311" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M11 12 L15 8 M29 12 L25 8 M20 5 L20 9" stroke="#161311" stroke-width="1.8" stroke-linecap="round"/></svg>
      </div>
      <div class="fighter-name" id="fighterPlayerName">You</div>
    </div>
    <div class="vs-badge">VS</div>
    <div class="fighter rival" id="fighterRival">
      <div class="avatar" id="fighterRivalAvatar">
        <svg viewBox="0 0 40 40"><rect x="10" y="9" width="20" height="16" rx="8" fill="#fff8ec" stroke="#161311" stroke-width="2"/><circle cx="16" cy="17" r="1.8" fill="#161311"/><circle cx="24" cy="17" r="1.8" fill="#161311"/><path d="M15 21 L25 21" stroke="#161311" stroke-width="1.8" stroke-linecap="round"/><path d="M14 9 L11 4 M26 9 L29 4" stroke="#161311" stroke-width="1.8" stroke-linecap="round"/></svg>
      </div>
      <div class="fighter-name" id="fighterRivalName">AI</div>
    </div>
  </div>

  <div class="bubble-wrap">
    <div class="bubble" id="bubble">Your move make your mark!</div>
  </div>

  <div class="panel">
    <div class="board" id="board"></div>

    <div class="score-strip">
      <div class="score-item x">
        <div class="label" id="scoreLabelX">You</div>
        <div class="value" id="scoreX">0</div>
      </div>
      <div class="score-item draws">
        <div class="label">Draws</div>
        <div class="value" id="scoreDraw">0</div>
      </div>
      <div class="score-item o">
        <div class="label" id="scoreLabelO">Rival</div>
        <div class="value" id="scoreO">0</div>
      </div>
    </div>

    <div class="controls">
      <div class="rank-select" id="rankSelect">
        <button data-level="easy">ROOKIE</button>
        <button data-level="medium">RIVAL</button>
        <button data-level="hard" class="active">LEGEND</button>
      </div>
      <div class="rank-caption" id="rankCaption">AI difficulty Â· VS AI mode</div>
      <button class="rematch-btn" id="resetBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        REMATCH
      </button>
    </div>
  </div>

  <div class="footnote">Minimax Engine Â· +10 X Â· âˆ’10 O Â· 0 Draw</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/brython@3.12.3/brython.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/brython@3.12.3/brython_stdlib.js"></script>
<script type="text/python" src="game.py"></script>
</body>
</html>
